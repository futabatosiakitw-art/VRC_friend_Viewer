<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>VRC Friend Monitor</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; background: #1a1a1a; color: #fff; }
        h1 { text-align: center; font-size: 24px; }
        .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        input[type="text"] { flex: 1; padding: 10px; font-size: 16px; border-radius: 6px; border: 1px solid #444; background: #2a2a2a; color: #fff; }
        button { padding: 10px 20px; font-size: 16px; border-radius: 6px; border: none; background: #4CAF50; color: white; cursor: pointer; }
        button:hover { background: #45a049; }
        .friend-card { background: #2a2a2a; padding: 15px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; transition: 0.3s; }
        .friend-info { font-size: 18px; }
        .friend-status { padding: 8px 14px; border-radius: 6px; font-weight: bold; font-size: 14px; background: #555; }
        .delete-btn { background: #f44336; padding: 6px 12px; font-size: 12px; margin-left: 10px; }
        .delete-btn:hover { background: #d32f2f; }
        #audio-status { text-align: center; margin-bottom: 20px; font-size: 14px; color: #aaa; }
    </style>
</head>
<body>

    <h1>VRC Friend Monitor</h1>
    <div id="audio-status">🔊 音声有効化のため、ページ内のどこかをクリックしてください</div>

    <!-- フレンド追加フォーム -->
    <div class="input-group">
        <input type="text" id="friend-id-input" placeholder="フレンドID (例: usr_xxxxxxxx-xxxx...)">
        <button id="add-btn">追加</button>
    </div>

    <!-- フレンド一覧表示エリア -->
    <div id="friend-list"></div>

    <!-- 効果音用のオーディオ -->
    <audio id="alert-sound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <script>
        // ★さきほど発行されたCloudflare WorkersのURL
        const WORKER_URL = "https://vrcfreandveiw.futaba-to-siaki-tw.workers.dev";

        let friends = JSON.parse(localStorage.getItem('vrc_friends')) || [];
        let lastStates = JSON.parse(localStorage.getItem('vrc_last_states')) || {};
        let audioUnlocked = false;

        // 画面をクリックしたら音声再生のブロックを解除
        window.addEventListener('click', () => {
            if (!audioUnlocked) {
                audioUnlocked = true;
                document.getElementById('audio-status').innerText = "🔊 音声アラート有効中";
                document.getElementById('audio-status').style.color = "#4CAF50";
            }
        }, { once: true });

        // 追加ボタンの処理
        document.getElementById('add-btn').addEventListener('click', () => {
            const input = document.getElementById('friend-id-input');
            const id = input.value.trim();
            if (id && !friends.includes(id)) {
                friends.push(id);
                saveAndRender();
                input.value = '';
                checkAllFriends(); // 追加したら即座にチェック
            }
        });

        // 削除処理
        window.removeFriend = function(id) {
            friends = friends.filter(f => f !== id);
            delete lastStates[id];
            saveAndRender();
        }

        function saveAndRender() {
            localStorage.setItem('vrc_friends', JSON.stringify(friends));
            localStorage.setItem('vrc_last_states', JSON.stringify(lastStates));
            renderList();
        }

        function renderList() {
            const listContainer = document.getElementById('friend-list');
            if (friends.length === 0) {
                listContainer.innerHTML = '<p style="text-align: center; color: #777;">フレンドIDが登録されていません</p>';
                return;
            }

            listContainer.innerHTML = '';
            friends.forEach(id => {
                const state = lastStates[id] || { status: '未確認', bg: '#555' };
                const card = document.createElement('div');
                card.className = 'friend-card';
                card.innerHTML = `
                    <div class="friend-info">
                        <div style="font-size: 14px; color: #aaa; word-break: break-all;">${id}</div>
                    </div>
                    <div>
                        <span class="friend-status" style="background-color: ${state.bg};">${state.text}</span>
                        <button class="delete-btn" onclick="removeFriend('${id}')">削除</button>
                    </div>
                `;
                listContainer.appendChild(card);
            });
        }

        // 全員のステータスをチェックする関数
        async function checkAllFriends() {
            if (friends.length === 0) return;

            for (const id of friends) {
                const apiUrl = `${WORKER_URL}?path=/users/${id}`;
                const oldState = lastStates[id] ? lastStates[id].raw : "offline";

                try {
                    const response = await fetch(apiUrl, { credentials: 'include' });
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);

                    const data = await response.json();
                    const currentState = data.state; // "active", "online", "offline" など

                    let statusText = "";
                    let bgColor = "#555";

                    if (currentState !== "offline") {
                        statusText = `オンライン (${currentState})`;
                        bgColor = (currentState === "active") ? "#4CAF50" : "#2196F3"; // アクティブなら緑、オンラインなら青
                    } else {
                        statusText = "オフライン";
                        bgColor = "#555";
                    }

                    // オフラインからオンラインに変わった瞬間を検知！
                    if (currentState !== "offline" && oldState === "offline") {
                        if (audioUnlocked) {
                            document.getElementById('alert-sound').play().catch(e => console.log(e));
                        }
                    }

                    lastStates[id] = {
                        raw: currentState,
                        text: statusText,
                        bg: bgColor
                    };

                } catch (error) {
                    console.error(`${id} の取得失敗:`, error);
                    lastStates[id] = {
                        raw: "error",
                        text: "取得エラー (要ログイン)",
                        bg: "#f44336"
                    };
                }
            }

            saveAndRender();
            console.log(`[${new Date().toLocaleTimeString()}] 全フレンドのチェック完了`);
        }

        // 初期描画
        renderList();
        // 初回実行
        checkAllFriends();

        // 20分に1回 (20 * 60 * 1000ミリ秒) 全員分を自動チェック
        setInterval(checkAllFriends, 20 * 60 * 1000);
    </script>
</body>
</html>
